name: CI/CD Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  # Check 1: Enforce that PRs targeting 'main' ONLY come from 'dev'
  check-main-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Source Branch for main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ ERROR: Pull Requests into 'main' are ONLY allowed from the 'dev' branch!"
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ Passed: Merging from 'dev' into 'main'."

  # Run Tests for all PRs and Pushes
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: CI=false npm test -- --watchAll=false

  # Auto-Merge 'dev' into 'main' when tests pass on 'dev' push
  auto-merge-dev-to-main:
    needs: [test-and-build]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Merge dev into main
        uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          from_branch: dev
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Build & Push Docker Image (Runs only when code is pushed/merged into 'main')
  docker-build-push:
    needs: [test-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/real-state-react:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/real-state-react:${{ github.sha }}
